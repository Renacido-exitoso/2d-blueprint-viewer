<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Planos 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background-color: #1e293b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
    .controls { display: flex; gap: 0.75rem; align-items: center; }
    input[type="file"] { display: none; }
    .btn { background-color: #0284c7; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; border: none; font-weight: 500; transition: background 0.2s; }
    .btn:hover { background-color: #0369a1; }
    .btn-secondary { background-color: #334155; }
    .btn-secondary:hover { background-color: #475569; }
    #canvas-container { flex: 1; position: relative; overflow: hidden; cursor: grab; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; display: flex; justify-content: center; align-items: center; }
    #canvas-container:active { cursor: grabbing; }
    #blueprint-img { max-width: none; transform-origin: center center; transition: transform 0.05s ease-out; user-select: none; pointer-events: none; }
    .empty-state { text-align: center; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h1>📐 Visor de Planos 2D</h1>
    <div class="controls">
      <label for="file-input" class="btn">📂 Cargar Plano</label>
      <input type="file" id="file-input" accept="image/*">
      <button class="btn btn-secondary" id="reset-btn">🔄 Restablecer Vista</button>
    </div>
  </header>

  <main id="canvas-container">
    <div id="empty-state" class="empty-state">
      <p>Selecciona un archivo de imagen o plano 2D para comenzar la inspección.</p>
    </div>
    <img id="blueprint-img" src="" alt="Plano 2D" style="display: none;">
  </main>

  <script>
    const fileInput = document.getElementById('file-input');
    const img = document.getElementById('blueprint-img');
    const emptyState = document.getElementById('empty-state');
    const container = document.getElementById('canvas-container');
    const resetBtn = document.getElementById('reset-btn');

    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          img.src = event.target.result;
          img.style.display = 'block';
          emptyState.style.display = 'none';
          resetTransform();
        };
        reader.readAsDataURL(file);
      }
    });

    function setTransform() {
      img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function resetTransform() {
      scale = 1;
      pointX = 0;
      pointY = 0;
      setTransform();
    }

    container.addEventListener('mousedown', (e) => {
      if (img.style.display === 'none') return;
      e.preventDefault();
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
      isPanning = true;
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    container.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      e.preventDefault();
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      setTransform();
    });

    container.addEventListener('wheel', (e) => {
      if (img.style.display === 'none') return;
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;
      (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
      scale = Math.min(Math.max(0.2, scale), 10);
      setTransform();
    });

    resetBtn.addEventListener('click', resetTransform);
  </script>
</body>
</html>
